/* ===== 大屏（?mode=screen）—— 按 Start/*.png 品牌设计稿重做 =====
   设计画布 1920x1080；--s = 1 个设计像素，按 16:9 等比缩放，永不出框。 */
.screen{position:relative;width:100vw;height:100vh;overflow:hidden;color:#fff;
background:#C10043 url('./assets/screen-background.svg') center/cover no-repeat;
--s:min(0.0520833vw,0.0925926vh);
--y-logo:143;--y-title:368;--y-brand:247.9;--y-prize:500.4;--y-name:628;--y-congrats:767.4}
/* 1920x1080 设计画布：等比缩放后整体居中，任何屏幕比例都不出框 */
.screen-stage{position:absolute;left:50%;top:50%;width:calc(1920*var(--s));height:calc(1080*var(--s));transform:translate(-50%,-50%)}
/* 水平居中：图片用 .screen-mid，文字用 .screen-midc（同时垂直居中） */
.screen-mid{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center}
.screen-midc{position:absolute;left:50%;transform:translate(-50%,-50%);white-space:nowrap;text-align:center}
.screen-logo{top:calc(var(--y-logo)*var(--s));width:calc(531*var(--s));height:auto;transform:translate(-50%,-50%)}
.screen-brand{top:calc(var(--y-brand)*var(--s));font-size:calc(44*var(--s));font-weight:500;line-height:1}
.screen-title{top:calc(var(--y-title)*var(--s));width:calc(1263*var(--s));height:auto;transform:translate(-50%,-50%)}
.screen-prize{top:calc(var(--y-prize)*var(--s));font-size:calc(58*var(--s));font-weight:600;line-height:1;letter-spacing:.01em;padding:calc(16*var(--s)) calc(42*var(--s));border-radius:999px;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 calc(2*var(--s)) rgba(255,255,255,.3);backdrop-filter:blur(3px)}
.screen-name{top:calc(var(--y-name)*var(--s));font-size:calc(118*var(--s));font-weight:700;line-height:1;letter-spacing:-.035em;max-width:calc(1740*var(--s));overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 calc(46*var(--s)) rgba(255,255,255,.42),0 calc(8*var(--s)) calc(34*var(--s)) rgba(110,0,38,.35)}
.screen-congrats{top:calc(var(--y-congrats)*var(--s));font-size:calc(54*var(--s));font-weight:600;line-height:1;letter-spacing:.01em;opacity:.9}
.screen-rolling{animation:screen-pulse .16s infinite alternate}
@keyframes screen-pulse{from{opacity:.55}to{opacity:1}}
/* 按钮：实测 高55 / 全圆角 / #FC314A / 白字 700 44px */
.screen-btn{position:absolute;top:calc(917*var(--s));height:calc(55*var(--s));border-radius:999px;
background:#FC314A;color:#fff;font:700 calc(45*var(--s))/1 Poppins,"Microsoft YaHei","PingFang SC",sans-serif;letter-spacing:-.0074em;
display:grid;place-items:center;padding:0 calc(20*var(--s));white-space:nowrap;transition:background .15s,transform .15s}
.screen-btn:hover{background:#ff5064}
.screen-btn.start{top:calc(872*var(--s));left:50%;transform:translateX(-50%);min-width:calc(152*var(--s));font-size:calc(45*var(--s))}
.screen-btn.left{left:calc(328*var(--s));min-width:calc(258*var(--s))}
.screen-btn.right{left:calc(1334*var(--s));min-width:calc(258*var(--s))}
.screen-btn.center{left:50%;transform:translateX(-50%);min-width:calc(376*var(--s))}
.screen-btn.start:active,.screen-btn.center:active{transform:translateX(-50%) scale(.975)}
.screen-btn.left:active,.screen-btn.right:active{transform:scale(.975)}
/* 操作区：默认隐身，鼠标一动浮出 2.6 秒（大屏投影上保持干净） */
.screen-chrome{position:absolute;right:calc(48*var(--s));top:calc(34*var(--s));display:flex;gap:calc(14*var(--s));align-items:center;
opacity:0;transition:opacity .35s;font-size:calc(24*var(--s));letter-spacing:.06em;text-transform:uppercase;z-index:4}
.screen.chrome-on .screen-chrome{opacity:.78}
.screen-chrome b{font-weight:600;opacity:.75}
.screen-chrome a,.screen-chrome button{color:#fff;background:rgba(255,255,255,.16);border:0;border-radius:999px;
padding:calc(9*var(--s)) calc(20*var(--s));font:inherit;text-decoration:none;cursor:pointer}
.screen-chrome a:hover,.screen-chrome button:hover{background:rgba(255,255,255,.3)}
/* 应用内二次确认（大屏上不使用任何原生弹窗） */
.screen-ask{position:absolute;inset:0;display:grid;place-items:center;background:rgba(58,0,24,.6);backdrop-filter:blur(4px);z-index:6}
.screen-ask-card{background:#fff;color:#5C0030;border-radius:calc(30*var(--s));padding:calc(48*var(--s)) calc(66*var(--s)) calc(40*var(--s));

.screen-ask-card p{margin:0 0 calc(36*var(--s));font:600 calc(40*var(--s))/1.45 Poppins,"Microsoft YaHei","PingFang SC",sans-serif;white-space:normal}
.screen-ask-row{display:flex;gap:calc(20*var(--s));justify-content:center}
.ask-btn{border:0;border-radius:999px;background:#FC314A;color:#fff;font:700 calc(32*var(--s))/1 Poppins,"Microsoft YaHei",sans-serif;
padding:calc(21*var(--s)) calc(46*var(--s));cursor:pointer;min-width:calc(180*var(--s))}
.ask-btn:hover{background:#ff5064}
.ask-btn.ghost{background:#fff;color:#5C0030;box-shadow:inset 0 0 0 calc(3*var(--s)) #EBD6DE}
.ask-btn.ghost:hover{background:#FDF2F6}
/* ===== 中奖特效：光晕爆发 + 冲击波环 + 上升星屑 + 斜向扫光 =====
   注意：这一层挂在 body 下的 #fx，而不是 #app 里 —— #app 每 800ms 整块重建，
   动画会被反复重启、永远播不完。 */
.fx{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.fx-glow{position:absolute;left:50%;top:50%;width:78vmax;height:78vmax;border-radius:50%;opacity:0;
transform:translate(-50%,-50%) scale(.5);
background:radial-gradient(circle,rgba(255,255,255,.52) 0%,rgba(255,200,222,.3) 30%,rgba(255,150,190,0) 66%);
animation:fxGlow 2s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fxGlow{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}28%{opacity:.95}
100%{opacity:0;transform:translate(-50%,-50%) scale(1.34)}}
.fx-ring{position:absolute;left:50%;top:50%;width:min(46vmax,900px);aspect-ratio:1/1;border-radius:50%;
border:2px solid rgba(255,255,255,.62);opacity:0;transform:translate(-50%,-50%) scale(.14);
animation:fxRing 1.7s cubic-bezier(.16,.8,.3,1) forwards}
.fx-ring.d2{animation-delay:.3s;border-color:rgba(255,255,255,.3);border-width:1px}
@keyframes fxRing{0%{opacity:0;transform:translate(-50%,-50%) scale(.14)}16%{opacity:.8}
100%{opacity:0;transform:translate(-50%,-50%) scale(1.95)}}
.fx-spark{position:absolute;left:var(--x);bottom:-6vh;width:var(--sz);height:var(--sz);border-radius:50%;opacity:0;
background:radial-gradient(circle,#fff 0%,rgba(255,230,186,.96) 40%,rgba(255,196,120,0) 74%);
box-shadow:0 0 16px rgba(255,216,156,.8);animation:fxSpark var(--dur) cubic-bezier(.25,.6,.3,1) var(--d) forwards}
@keyframes fxSpark{0%{opacity:0;transform:translateY(0) scale(.4)}10%{opacity:1}
58%{opacity:.9}100%{opacity:0;transform:translateY(-98vh) scale(1.05)}}
.fx-sheen{position:absolute;top:50%;left:-16%;width:18%;height:210%;opacity:0;
transform:translateY(-50%) rotate(14deg);filter:blur(10px);
background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.42),rgba(255,255,255,0));
animation:fxSheen 1.5s cubic-bezier(.3,.62,.24,1) .08s forwards}
@keyframes fxSheen{0%{opacity:0;transform:translate(0,-50%) rotate(14deg)}18%{opacity:.85}
100%{opacity:0;transform:translate(720%,-50%) rotate(14deg)}}

.switch{display:inline-flex;align-items:center;gap:9px;padding:9px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);cursor:pointer;user-select:none;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;transition:border-color .15s}

.switch i{position:relative;width:34px;height:20px;border-radius:999px;background:#e6d3dc;transition:background .18s;flex:none}
.switch i:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i:after{transform:translateX(14px)}
.switch input:checked~span{color:var(--ink)}
.switch input:focus-visible+i{box-shadow:0 0 0 3px rgba(193,0,67,.2)}

@media(max-width:580px){.guest-row{grid-template-columns:25px 1fr 92px!important}.guest-row>div:nth-child(4),.guest-row>div:nth-child(5),.guest-row>div:nth-child(6){display:none}}
